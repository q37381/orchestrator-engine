# ===== orchestrator-engine 异常文案(简体中文, 引擎默认语种) =====
#
# 键区间: AU204001 ~ AU204999 由引擎占用; 一个键一条, 参数用 MessageFormat 位置占位符 {0} {1}...
# 抛点: new ProcessException("AU204402", defId + ":" + version) —— 调用方只传键与参数, 不拼句子。
#
# 编码: ProcessException 用 UTF-8 读这个资源, 所以本文件按 UTF-8 存(不是 properties 老默认的 ISO-8859-1)。
# 语种: 这份**默认** bundle 就是中文, 不另建 _zh_CN 副本(两处内容会漂)。
#       要加英文再补 orchestrator-messages_en.properties; 消费者整体换文案源用 ProcessException.setResolver(...)。
# ⚠ 文案里不要出现单引号: MessageFormat 把 ' 当转义符, 写了会被吃掉(需要位置符请用中文引号或直接省略)。
# 兜底: 键缺失时 ProcessException 降级返回 "键: 参数...", 取消息这件事本身绝不抛异常。

# ---------- AU2040xx 上下文 ----------
AU204001=非分片 action 没有分片 payload, 无法取值

# ---------- AU2041xx flow DSL 解析 ----------
AU204101=flow DSL 末尾有多余字符: {0}
AU204102=控制节点 {0} 缺少命名后缀, 请写 {0}:名字(子项...); 把名字写在括号里(旧写法 {0}(名字,子项)) 会与匿名容器歧义, 位置 {1}
AU204103=聚合节点 GROUP:名字({0}, ...) 至少要有一个子节点
AU204104=无法写回 flow DSL 的表达式类型: {0}
AU204105=flow DSL 位置 {0} 期望一个节点引用
AU204106=flow DSL 期望字符 {0}, 位置 {1}
AU204107=节点引用与容器名不能含冒号(冒号只能写在关键字之后作命名后缀, 如 PARALLEL:名字(a,b); 旧写法 PARALLEL(名字: a,b) 请把名字挪到括号外): {0}
AU204108=命名并行容器 PARALLEL:{0}(...) 至少要有一个子节点
AU204109=关键字 {0} 后的冒号缺少命名后缀, 请写 {0}:名字(a,b), 位置 {1}
AU204110=控制节点 {0} 暂不支持命名后缀(IF 还没有纯容器声明这套口径), 请直接写 IF(条件,then,else); 要就近收敛请在全局 errorPolicy 或节点上声明

# ---------- AU2042xx 定义装载与聚合节点展开 ----------
AU204201=非法的 materialization 声明值: {0}, 只支持 EAGER 或 LAZY
AU204202=聚合节点不能放在 setup 段, 该段只接受叶子节点引用: {0}
AU204203=聚合节点不能放在 setdown 段, 该段只接受叶子节点引用: {0}
AU204204=命名容器声明了容器职责之外的字段: {0}(聚合节点 GROUP 可声明 setup/setdown/repeatSegments 包裹整个子节点序列, 但 handler/actions/shard/laneExecution/actionExecution 一律不能声明; 带命名后缀的并行是纯容器, 上述动作/段/执行档字段都不能声明)
AU204205=聚合节点嵌套超过 {1} 层: {0}
AU204206=聚合节点缺少 group.flow 声明: {0}
AU204207=聚合节点缺少 group.nodes 声明: {0}
AU204208=聚合节点的子节点键与既有节点键冲突: {0}
AU204209=聚合节点 {0} 的 group.flow 不能引用另一个顶层聚合节点 {1}, 要复用请嵌套声明在本组的 group.nodes 下
AU204210=聚合节点 {0} 的 group.flow 引用了未定义节点: {1}
AU204211=聚合节点 {0} 内不支持的表达式类型: {1}
AU204212=并行命名后缀 PARALLEL:{0}(...) 在 nodes 下没有对应声明, 请检查拼写(匿名并行请直接写 PARALLEL(a,b), 不要带冒号后缀)
AU204213=节点 {0} 只声明了容器属性(没有 handler/actions/shard), 却未被 flow 引用, 这条声明不会生效
AU204214=非法的 autoRollback 声明值: {0}, 只支持 true 或 false(留空或不写即不自动回退)
AU204215=节点 {0} 的 setup/setdown 段动作 id 与主段或其他段重复: {1}
AU204216=节点 {0} 声明了 setup/setdown 段但缺主段(handler 或 actions), 段没有可包裹的主体
AU204217=节点 {0} 声明了 repeatSegments 但未声明 setup/setdown 段, 段重复执行开关没有作用对象
AU204218=流程声明了 repeatSegments 但未声明流程级 setup/setdown 段, 段重复执行开关没有作用对象
AU204219=非法的 repeatSegments 声明值: {0}, 只支持 true 或 false(留空或不写即不重复执行)
AU204220=节点 {0} 的动作 {1} 声明了 setup 段但未同挂 setdown 段——action 级段必须同挂成对(拆分式多段暂不支持)
AU204221=节点 {0} 的动作 {1} 声明了 setdown 段但未同挂 setup 段——action 级段必须同挂成对(拆分式多段暂不支持)
AU204222=节点 {0} 的动作项 {1} 不得声明 setup/setdown 段标记, action 级段只能声明在主段动作上
AU204223=节点 {0} 的段动作 id 与主段/节点段/其他 action 级段重复: {1}
AU204224=节点 {0} 声明了 action 级段, 与 actionExecution: PARALLEL 互斥(级段有先后语义)
AU204225=聚合节点的段声明无效: {0} 的 {1}
AU204226=节点 {0} 声明了段或 repeatSegments, 却被同时当作聚合容器(GROUP)与普通叶子引用: 一份定义不能有两种用途, 请拆成两条声明
AU204227=非法的 segmentsFollowShard 声明值: {0}, 只支持 true 或 false(留空或不写即段跟随分片, 每 lane 各跑一遍 setup/setdown)
AU204228=节点 {0} 声明了 segmentsFollowShard: false 但未声明 setup/setdown 段, 段不跟随分片开关没有作用对象
AU204229=非分片节点 {0} 声明了 segmentsFollowShard: false 却没有分片可"不跟随"(该开关只对分片叶子的节点级段有意义)
AU204230=节点 {0} 的 {1} 段声明形状非法: 要么全部是内联动作(map 列表), 要么全部是子节点引用(字符串列表), 同一条声明里不能混用, 组的 setup 与 setdown 也必须同形状
AU204231=节点 {0} 的段声明了子节点引用, 但节点级段只接受内联动作——子节点引用只用于聚合节点 GROUP 的组级段
AU204232=聚合节点 {0} 的组级段引用 {1} 非法: 只能引用本组 group.nodes 下直接声明的叶子子节点(不能是嵌套聚合节点, 也不能是组外节点)
AU204233=聚合节点 {0} 的子节点 {1} 同时被组级段与主体 flow 引用: 一个子节点不能既在段又在主体, 请拆成两条声明
AU204234=非法的 settleOnStop 声明值: {0}, 只支持 true 或 false(留空或不写即停止不等待收尾)
AU204235=节点 {0} 的 {1} 在 group: 段内与节点属性上重复声明: 同一条组级声明只能写一处(建议统一写在 group: 段内, 与流程级 setup/flow/setdown 同形)

